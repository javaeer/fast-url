name: Bug report
description: 报告一个缺陷 / 异常行为
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: desc
    attributes:
      label: 缺陷描述
      description: 清晰、简洁地描述你遇到的问题
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 一步步说明如何复现该行为
      placeholder: |
        1. 启动服务并连接 MySQL/Redis/RabbitMQ
        2. 调用 ...
        3. 观察到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你认为应当发生什么
    validations:
      required: false
  - type: input
    id: env
    attributes:
      label: 环境
      description: JDK / Spring Boot / MySQL / Redis / RabbitMQ 版本
      placeholder: "JDK 8, Spring Boot 2.7.18, MySQL 8, Redis 7, RabbitMQ 3"
    validations:
      required: false
